plugins {
    id 'java'
    id 'application'
}

group = 'com.hoclamdev'
version = '1.0.0'

repositories {
    mavenCentral()
}

application {
    mainClassName = 'com.hoclamdev.server.RedisServer'
}

jar {
    manifest {
        attributes(
                'Main-Class': 'com.hoclamdev.server.RedisServer'
        )
    }
}

dependencies {
    implementation 'org.apache.logging.log4j:log4j-core:2.22.1'
    implementation 'org.apache.logging.log4j:log4j-api:2.22.1'
}

